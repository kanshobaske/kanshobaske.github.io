<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大会予定 - 諫早商業高校バスケットボール部</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- 共通CSSと大会予定ページ専用CSS -->
<link rel="stylesheet" href="style.css">

<!-- フィルターおよび今日の日付マーク用のスタイル -->
<link rel="stylesheet" href="schedule-page.css">
</head>

<body>

<!-- ページ構成：ヘッダー、試合一覧、月別カレンダーの順で表示します。 -->

<!-- 共通ヘッダー：ロゴを押すとホームへ戻ります。 -->
<header>
<a href="index.html" class="logo-link" aria-label="ホームへ戻る">
  <div class="logo">
    <span class="school-name">諫早商業高等学校</span>
    <span class="club-name">男子バスケットボール部</span>
  </div>
</a>
<nav>
<a href="index.html">HOME</a>
<a href="news.html">ニュース</a>
<a href="basketballschedule.html" class="active-page">大会予定</a>
<a href="sinrosaki.html">進路先</a>
<a href="isahayashougyounituite.html">諫早商業高校について</a>
</nav>
</header>

<!-- 大会・試合の一覧と、日付を確認するカレンダー本体です。 -->
<main>
<section class="schedule-section">
<div class="container">

<h2 class="section-title">SCHEDULE</h2>
<p class="sub-title">2026年度 試合・大会スケジュール</p>

<!-- 絞り込みフィルターボタン -->
<div class="filter-container">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="official">公式戦</button>
    <button class="filter-btn" data-filter="practice">練習試合</button>
</div>

<!-- スケジュールカード一覧 -->
<div class="schedule-list" id="schedule-list"><p>大会予定を読み込んでいます…</p></div><!-- /.schedule-list -->

<!-- カレンダーセクション -->
<div class="calendar-section">
    <div class="calendar-header">
        <button class="calendar-btn" id="prev-btn" aria-label="先月のカレンダーを表示"><span>←</span> 先月</button>
        <h3 class="calendar-title" id="calendar-title">----年 --月</h3>
        <button class="calendar-btn" id="next-btn" aria-label="次月のカレンダーを表示">次月 <span>→</span></button>
    </div>
    
    <div class="calendar-slider-container">
        <div class="calendar-slider-track" id="calendar-track">
            <div class="calendar-wrapper" id="cal-prev-box"></div>
            <div class="calendar-wrapper" id="cal-current-box"></div>
            <div class="calendar-wrapper" id="cal-next-box"></div>
        </div>
    </div>
</div>

</div><!-- /.container -->
</section>
</main>

<footer>
<p>&copy; 2026 諫早商業高校 男子バスケットボール部</p>
</footer>





<script src="script-loader.js" data-files="schedule-data.js,schedule-page.js"></script>
</body>
</html>
